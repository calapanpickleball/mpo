<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>MPO Cup 2026 — Admin</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="style.css">
<style>table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mute);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
.tabs button{background:none;border:0;color:var(--mute);font:600 .95rem Inter,sans-serif;padding:10px 18px;cursor:pointer;border-bottom:2px solid transparent}.tabs button.on{color:var(--gold);border-color:var(--orange)}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:18px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.stat small{color:var(--mute);display:block}
.st-Submitted{color:#9db3d8}.st-Confirmed-Unpaid{color:#ffb347}.st-Confirmed-Paid{color:#2ecc71}.st-Rejected{color:#ff5470}.tw{overflow-x:auto}select.s{width:auto;padding:6px}</style></head><body>
<div id="gate" class="wrap" style="padding-top:100px;max-width:420px"><h2 style="margin-bottom:20px">Admin Login</h2><form onsubmit="login(event)"><label>Passcode</label><input type="password" id="pw" autofocus><p><button class="btn">Enter</button></p><div id="ge"></div></form></div>
<div id="app" hidden><nav><div class="wrap"><b>MPO <span>ADMIN</span></b><div><a href="index.html">View site</a><a href="#" onclick="logout()">Logout</a></div></div></nav>
<div class="wrap" style="padding:24px 20px 60px"><div class="tabs"><button class="on" id="t1" onclick="tab(1)">Registrations</button><button id="t2" onclick="tab(2)">Event details</button></div>
<div id="p1"><div class="stats" id="stats"></div>
<div class="row" style="grid-template-columns:1fr 1fr 1fr 1fr;gap:10px"><select id="fc" onchange="draw()"><option value="">All categories</option></select><select id="fs" onchange="draw()"><option value="">All statuses</option></select><input id="q" placeholder="Search…" oninput="draw()"><button class="btn gold" onclick="csv()">Export CSV</button></div>
<div id="list" class="tw" style="margin-top:16px"></div></div>
<div id="p2" hidden><form id="sf" style="max-width:640px;margin-top:18px"></form></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script><script src="firebase-init.js"></script>
<script>
const ADMIN_PASS="mpo2026admin"; // CHANGE THIS before deploying
let rows=[],unsub;const $=id=>document.getElementById(id);
function login(e){e.preventDefault();if($('pw').value===ADMIN_PASS){sessionStorage.mpo=1;start();}else $('ge').innerHTML='<div class="msg err">Wrong passcode.</div>';}
function logout(){sessionStorage.removeItem('mpo');location.reload();}
function start(){$('gate').hidden=true;$('app').hidden=false;
 $('fc').innerHTML+=CATEGORIES.map(c=>`<option>${esc(c)}</option>`).join('');$('fs').innerHTML+=STATUSES.map(c=>`<option>${c}</option>`).join('');
 unsub=db.collection(REG).orderBy('createdAt','desc').onSnapshot(s=>{rows=s.docs.map(d=>({id:d.id,...d.data()}));draw();},e=>$('list').innerHTML='<div class="msg err">'+esc(e.message)+'</div>');
 getSettings().then(buildSettings);}
function tab(n){[1,2].forEach(i=>{$('p'+i).hidden=i!==n;$('t'+i).classList.toggle('on',i===n)});}
function draw(){const c=$('fc').value,s=$('fs').value,q=$('q').value.toLowerCase();
 $('stats').innerHTML=CATEGORIES.map(k=>{const r=rows.filter(x=>x.category===k),n=st=>r.filter(x=>x.status===st).length;
  return `<div class="stat"><b>${esc(k)}</b><br><big>${r.length}</big> teams<small>Paid ${n('Confirmed-Paid')} · Unpaid ${n('Confirmed-Unpaid')} · New ${n('Submitted')} · Rej ${n('Rejected')}</small></div>`}).join('');
 const v=rows.filter(x=>(!c||x.category===c)&&(!s||x.status===s)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));
 $('list').innerHTML=v.length?`<table><tr><th>Team</th><th>Category</th><th>Players</th><th>Contact</th><th>Status</th><th></th></tr>`+v.map(x=>`<tr><td><b>${esc(x.team)}</b><br><small>${x.createdAt?x.createdAt.toDate().toLocaleString():''}</small></td><td>${esc(x.category)}</td><td>${esc(x.p1)} (${esc(x.c1)})<br>${esc(x.p2)} (${esc(x.c2)})</td><td>${esc(x.phone)}<br>${esc(x.email)}${x.notes?'<br><i>'+esc(x.notes)+'</i>':''}</td><td><select class="s st-${x.status}" onchange="setSt('${x.id}',this.value)">${STATUSES.map(t=>`<option ${t===x.status?'selected':''}>${t}</option>`).join('')}</select></td><td><button onclick="del('${x.id}')" style="background:none;border:0;color:#ff5470;cursor:pointer">Delete</button></td></tr>`).join('')+'</table>':'<p style="color:var(--mute)">No registrations found.</p>';}
const setSt=(id,s)=>db.collection(REG).doc(id).update({status:s});
const del=id=>confirm('Delete this registration permanently?')&&db.collection(REG).doc(id).delete();
function csv(){const h=['team','category','p1','c1','p2','c2','phone','email','status','notes'];
 const t=[h.join(',')].concat(rows.map(r=>h.map(k=>'"'+String(r[k]||'').replace(/"/g,'""')+'"').join(','))).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='mpo-cup-2026-registrations.csv';a.click();}
const FIELDS=[['date','Event date'],['venue','Venue'],['deadline','Registration deadline'],['fee','Entry fee'],['prize','Prize pool'],['contact','Contact person'],['phone','Contact number'],['email','Contact email'],['slots','Slots per category']];
function buildSettings(s){$('sf').innerHTML=FIELDS.map(([k,l])=>`<label>${l}</label><input name="${k}" value="${esc(s[k])}">`).join('')+`<label class="chk"><input type="checkbox" name="open" ${s.open?'checked':''}> Registration open</label><p><button class="btn">Save details</button> <span id="sm"></span></p>`;
 $('sf').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData($('sf')));d.open=!!d.open;d.slots=+d.slots||0;await SET.set(d,{merge:true});$('sm').textContent='Saved ✔';};}
if(sessionStorage.mpo)start();
</script></body></html>
